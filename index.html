
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oaklands WikiForever — StormparForever</title>

  <style>
    :root {
      --background: #080e19;
      --panel: #101b2c;
      --panel-light: #15243a;
      --border: #263c56;
      --accent: #35d5f2;
      --accent-soft: #173d50;
      --text: #eaf3ff;
      --muted: #91a5bd;
      --success: #78e6b0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      padding: 18px 30px;
      background: #0c1524;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 11px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 23px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0.2px;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      gap: 24px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px;
    }

    .sidebar {
      align-self: start;
      padding: 20px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .sidebar-title {
      margin: 0 10px 17px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .tree,
    .tree-children {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tree-children {
      margin-left: 15px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .tree-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 10px;
      text-align: left;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
    }

    .tree-button:hover {
      color: var(--text);
      background: var(--panel-light);
    }

    .tree-button.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: #276078;
    }

    .tree-icon {
      width: 18px;
      text-align: center;
      font-size: 15px;
    }

    .tree-label {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .tree-arrow {
      color: var(--muted);
      font-size: 11px;
    }

    .main {
      min-width: 0;
    }

    .item-card {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .item-header {
      display: flex;
      align-items: center;
      gap: 23px;
      padding: 27px;
      background:
        radial-gradient(
          ellipse at 90% 0%,
          rgba(38, 160, 199, 0.13),
          transparent 55%
        ),
        var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .item-image {
      width: 118px;
      height: 118px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #0b1525;
      border: 1px solid #29445f;
      border-radius: 13px;
      color: var(--accent);
      font-size: 52px;
    }

    .item-heading {
      min-width: 0;
    }

    .item-type {
      margin-bottom: 9px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .item-heading h2 {
      margin: 0;
      font-size: clamp(25px, 4vw, 35px);
      overflow-wrap: anywhere;
    }

    .item-subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .item-content {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(230px, 0.8fr);
      gap: 22px;
      padding: 25px;
    }

    .section {
      min-width: 0;
      padding: 19px;
      background: #0c1626;
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 19px;
      font-size: 15px;
      font-weight: 750;
    }

    .section-title span {
      color: var(--accent);
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid #1d2c40;
    }

    .stat-row:first-child {
      padding-top: 0;
    }

    .stat-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    .stat-value {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .stat-value.available {
      color: var(--success);
    }

    .description {
      color: #b6c6d9;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .description p {
      margin: 0 0 14px;
    }

    .description p:last-child {
      margin-bottom: 0;
    }

    .history {
      margin: 0 25px 25px;
      padding: 20px;
      background: #0c1626;
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .history-entry {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 14px 0 0;
      border-top: 1px solid #1d2c40;
    }

    .history-entry + .history-entry {
      margin-top: 13px;
    }

    .history-marker {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      margin-top: 5px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(53, 213, 242, 0.25);
    }

    .history-entry p {
      margin: 0;
      color: #b6c6d9;
      font-size: 13px;
      line-height: 1.7;
    }

    .history-entry strong {
      color: var(--text);
    }

    .category-card {
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .category-card h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .category-description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .category-entry {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      color: var(--text);
      text-align: left;
      background: #0c1626;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
    }

    .category-entry:hover {
      border-color: var(--accent);
      background: var(--panel-light);
    }

    .category-entry-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 9px;
      font-size: 22px;
    }

    .category-entry strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .category-entry small {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 17px;
      }

      .sidebar {
        padding: 15px;
      }

      .tree-children {
        margin-left: 10px;
      }

      .item-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 16px;
      }

      .brand h1 {
        font-size: 16px;
      }

      .layout {
        padding: 12px;
      }

      .item-header {
        align-items: flex-start;
        gap: 15px;
        padding: 18px;
      }

      .item-image {
        width: 82px;
        height: 82px;
        font-size: 37px;
      }

      .item-heading h2 {
        font-size: 24px;
      }

      .item-content {
        padding: 14px;
        gap: 14px;
      }

      .section {
        padding: 15px;
      }

      .history {
        margin: 0 14px 14px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">O</div>
        <div>
          <h1>Oaklands WikiForever</h1>
          <p>StormparForever Edition</p>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h2 class="sidebar-title">Wiki</h2>

        <nav class="tree" aria-label="Wiki categories">
          <button
            class="tree-button"
            id="tools-button"
            type="button"
            aria-expanded="true"
          >
            <span class="tree-icon">▰</span>
            <span class="tree-label">Tools</span>
            <span class="tree-arrow">▾</span>
          </button>

          <div class="tree-children" id="tools-children">
            <button
              class="tree-button"
              id="axes-button"
              type="button"
              aria-expanded="true"
            >
              <span class="tree-icon">⚒</span>
              <span class="tree-label">Axes</span>
              <span class="tree-arrow">▾</span>
            </button>

            <div class="tree-children" id="axes-children">
              <button
                class="tree-button active"
                id="rusty-axe-button"
                type="button"
                aria-current="page"
              >
                <span class="tree-icon">◈</span>
                <span class="tree-label">Rusty Axe</span>
              </button>
            </div>
          </div>
        </nav>
      </aside>

      <main class="main" id="main-content">
        <!-- The selected item's reusable detail layout is rendered here. -->
      </main>
    </div>
  </div>

  <script>
    /*
      ITEM DATA

      Add future items to this object and give each one the same fields.
      Every item will use the same item-detail layout automatically.

      No search functionality or search interface is included.
    */

    const wikiItems = {
      rustyAxe: {
        id: "rustyAxe",
        name: "Rusty Axe",
        category: "Tools / Axes",
        tier: "Tier 1",
        icon: "⚒",
        subtitle: "Tool information and in-game statistics",

        stats: [
          { label: "Tier", value: "1" },
          { label: "Swing Time", value: "0.85s" },
          { label: "Swing Power", value: "0.65s" },
          { label: "Range", value: "12 studs" },
          { label: "Location", value: "Oak Depot" },
          { label: "Price", value: "134 Oakbucks" },
          {
            label: "Availability",
            value: "Obtainable",
            style: "available"
          }
        ],

        description: [
          "The Rusty Axe is a tool listed in the Oaklands Tools category, under Axes.",
          "This page contains its recorded statistics, location, price, and update history."
        ],

        history: [
          {
            version: "Update 1.24",
            text: "The listed price was reduced from 300 to 134 Oakbucks."
          }
        ]
      }
    };

    /*
      REUSABLE ITEM DETAIL TEMPLATE

      The same function renders every item, keeping the stats,
      description, and history sections consistent.
    */

    function renderItem(item) {
      const main = document.getElementById("main-content");

      const statsHTML = item.stats.map(stat => `
        <div class="stat-row">
          <span class="stat-label">${escapeHTML(stat.label)}</span>
          <span class="stat-value ${stat.style || ""}">
            ${escapeHTML(stat.value)}
          </span>
        </div>
      `).join("");

      const descriptionHTML = item.description.map(paragraph => `
        <p>${escapeHTML(paragraph)}</p>
      `).join("");

      const historyHTML = item.history.length
        ? `
          <section class="history">
            <h3 class="section-title">
              <span>◷</span>
              Update History
            </h3>

            ${item.history.map(entry => `
              <div class="history-entry">
                <span class="history-marker"></span>
                <p>
                  <strong>${escapeHTML(entry.version)}</strong><br>
                  ${escapeHTML(entry.text)}
                </p>
              </div>
            `).join("")}
          </section>
        `
        : "";

      main.innerHTML = `
        <article class="item-card">
          <header class="item-header">
            <div class="item-image" aria-hidden="true">
              ${escapeHTML(item.icon)}
            </div>

            <div class="item-heading">
              <div class="item-type">
                ${escapeHTML(item.category)}
              </div>

              <h2>${escapeHTML(item.name)}</h2>

              <p class="item-subtitle">
                ${escapeHTML(item.subtitle)}
              </p>
            </div>
          </header>

          <div class="item-content">
            <section class="section">
              <h3 class="section-title">
                <span>▤</span>
                Tool Statistics
              </h3>

              <div class="stats">
                ${statsHTML}
              </div>
            </section>

            <section class="section">
              <h3 class="section-title">
                <span>≡</span>
                Item Description
              </h3>

              <div class="description">
                ${descriptionHTML}
              </div>
            </section>
          </div>

          ${historyHTML}
        </article>
      `;
    }

    /*
      CATEGORY VIEWS

      Only the approved hierarchy is shown:
      Tools → Axes → Rusty Axe
    */

    function renderCategory(category) {
      const main = document.getElementById("main-content");

      if (category === "tools") {
        main.innerHTML = `
          <section class="category-card">
            <h2>Tools</h2>
            <p class="category-description">
              Browse the tools documented in the Oaklands WikiForever.
            </p>

            <button class="category-entry" id="open-axes" type="button">
              <span class="category-entry-icon">⚒</span>
              <span>
                <strong>Axes</strong>
                <small>View the Axes category</small>
              </span>
            </button>
          </section>
        `;

        document
          .getElementById("open-axes")
          .addEventListener("click", () => {
            selectCategory("axes");
          });

        return;
      }

      if (category === "axes") {
        main.innerHTML = `
          <section class="category-card">
            <h2>Axes</h2>
            <p class="category-description">
              View the axe item documented in this edition of the wiki.
            </p>

            <button
              class="category-entry"
              id="open-rusty-axe"
              type="button"
            >
              <span class="category-entry-icon">⚒</span>
              <span>
                <strong>Rusty Axe</strong>
                <small>View item details and statistics</small>
              </span>
            </button>
          </section>
        `;

        document
          .getElementById("open-rusty-axe")
          .addEventListener("click", () => {
            selectItem("rustyAxe");
          });
      }
    }

    function setActiveTreeItem(activeId) {
      const buttons = [
        "tools-button",
        "axes-button",
        "rusty-axe-button"
      ];

      buttons.forEach(id => {
        const button = document.getElementById(id);

        button.classList.remove("active");
        button.removeAttribute("aria-current");
      });

      if (activeId) {
        const activeButton = document.getElementById(activeId);

        activeButton.classList.add("active");
        activeButton.setAttribute("aria-current", "page");
      }
    }

    function selectCategory(category) {
      if (category === "tools") {
        setActiveTreeItem("tools-button");
        renderCategory("tools");
      } else if (category === "axes") {
        setActiveTreeItem("axes-button");
        renderCategory("axes");
      }
    }

    function selectItem(itemId) {
      const item = wikiItems[itemId];

      if (!item) {
        return;
      }

      setActiveTreeItem("rusty-axe-button");
      renderItem(item);
    }

    /*
      Safe text insertion for item data.
    */

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => {
        const replacements = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return replacements[character];
      });
    }

    /*
      Expand or collapse the existing hierarchy.
      No extra menus, breadcrumbs, or back buttons.
    */

    function toggleTree(buttonId, childrenId) {
      const button = document.getElementById(buttonId);
      const children = document.getElementById(childrenId);
      const expanded = button.getAttribute("aria-expanded") === "true";

      button.setAttribute("aria-expanded", String(!expanded));
      children.hidden = expanded;

      const arrow = button.querySelector(".tree-arrow");
      arrow.textContent = expanded ? "▸" : "▾";
    }

    document
      .getElementById("tools-button")
      .addEventListener("click", () => {
        toggleTree("tools-button", "tools-children");
        selectCategory("tools");
      });

    document
      .getElementById("axes-button")
      .addEventListener("click", () => {
        toggleTree("axes-button", "axes-children");
        selectCategory("axes");
      });

    document
      .getElementById("rusty-axe-button")
      .addEventListener("click", () => {
        selectItem("rustyAxe");
      });

    /*
      Open directly to the Rusty Axe item page.
    */

    selectItem("rustyAxe");
  </script>
</body>
</html>
