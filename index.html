
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oaklands WikiForever — StormparForever</title>

<style>
:root {
  --background: #0b1422;
  --header: #10243a;
  --sidebar: #101e30;
  --panel: #13283b;
  --panel-hover: #192d41;
  --selected: #087ca5;
  --border: #29445c;
  --text: #edf7ff;
  --muted: #a8bfd3;
  --accent: #8ddcff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

button {
  font: inherit;
}

.site-header {
  background: var(--header);
  padding: 22px 24px;
  border-bottom: 1px solid var(--border);
}

.site-title {
  margin: 0;
  font-size: 27px;
  line-height: 1.3;
  font-weight: 700;
}

.site-subtitle {
  margin-top: 5px;
  color: var(--accent);
  font-size: 14px;
}

.layout {
  display: flex;
  align-items: stretch;
  min-height: calc(100vh - 91px);
}

.sidebar {
  flex: 0 0 235px;
  width: 235px;
  padding: 18px 14px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
}

.sidebar-heading {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.nav-tree {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-button {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--panel-hover);
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background 0.15s ease;
}

.nav-button:hover {
  background: #21415c;
}

.nav-button.active {
  background: var(--selected);
  border-color: #1598c4;
}

.nav-children {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-left: 12px;
  padding-left: 10px;
  border-left: 1px solid var(--border);
}

.main-content {
  flex: 1;
  min-width: 0;
  padding: 26px;
}

.page {
  display: none;
  width: 100%;
  max-width: 1000px;
}

.page.active {
  display: block;
}

h1 {
  margin: 0 0 8px;
  font-size: 27px;
  line-height: 1.3;
}

h2 {
  margin: 0 0 12px;
  font-size: 19px;
  line-height: 1.4;
}

.muted {
  color: var(--muted);
}

.tier {
  margin: 0 0 20px;
  color: var(--accent);
  font-size: 14px;
}

.divider {
  height: 1px;
  margin: 18px 0;
  background: var(--border);
}

.category-card {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 17px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.category-card:hover {
  border-color: var(--accent);
  background: var(--panel-hover);
}

.category-card h2 {
  margin-bottom: 4px;
}

.category-card p {
  margin: 0;
  color: var(--muted);
}

.axe-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
}

.axe-card {
  display: block;
  width: 100%;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.axe-card:hover {
  background: var(--panel-hover);
  border-color: var(--accent);
}

.axe-card h2 {
  margin-bottom: 4px;
}

.axe-card .tier {
  margin: 0;
}

.item-details {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
  margin-top: 22px;
}

.detail-section {
  min-width: 0;
}

.stats-box,
.description-box {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
}

.stats-list {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.stat-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.stat-label {
  color: var(--muted);
  overflow-wrap: anywhere;
}

.stat-value {
  color: var(--text);
  text-align: right;
  overflow-wrap: anywhere;
}

.stat-divider {
  height: 1px;
  background: var(--border);
}

.description-box p {
  margin: 0 0 14px;
  color: #e4eef7;
  overflow-wrap: anywhere;
}

.description-box p:last-child {
  margin-bottom: 0;
}

@media (max-width: 700px) {
  .site-header {
    padding: 18px;
  }

  .site-title {
    font-size: 23px;
  }

  .layout {
    min-height: calc(100vh - 84px);
  }

  .sidebar {
    flex: 0 0 130px;
    width: 130px;
    padding: 14px 9px;
  }

  .nav-button {
    padding: 9px 8px;
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  .nav-children {
    margin-left: 5px;
    padding-left: 6px;
  }

  .main-content {
    padding: 18px 12px;
  }

  h1 {
    font-size: 23px;
  }

  h2 {
    font-size: 17px;
  }

  .item-details {
    grid-template-columns: minmax(0, 1fr);
    gap: 20px;
  }

  .stats-box,
  .description-box {
    padding: 12px;
  }

  .stat-row {
    gap: 8px;
    font-size: 13px;
  }
}
</style>
</head>

<body>
<header class="site-header">
  <h1 class="site-title">Oaklands WikiForever</h1>
  <div class="site-subtitle">StormparForever Edition</div>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-heading">Navigation</div>
    <nav id="navigation" class="nav-tree" aria-label="Wiki navigation">
      <button
        type="button"
        class="nav-button"
        id="tools-nav"
        onclick="openTools()"
      >Tools</button>

      <div id="axes-nav-container" class="nav-children" hidden>
        <button
          type="button"
          class="nav-button"
          id="axes-nav"
          onclick="openAxes()"
        >Axes</button>

        <div id="selected-axe-container" class="nav-children" hidden>
          <button
            type="button"
            class="nav-button"
            id="selected-axe-nav"
            onclick="openSelectedAxe()"
          ></button>
        </div>
      </div>
    </nav>
  </aside>

  <main class="main-content">

    <!-- HOME SCREEN: deliberately contains no buttons -->
    <section id="home-page" class="page active">
      <h1>Welcome</h1>
      <p class="muted">Choose an option on the navigation to begin.</p>
    </section>

    <!-- TOOLS -->
    <section id="tools-page" class="page">
      <h1>Tools</h1>
      <p class="muted">Browse the tools available in Oaklands.</p>

      <button
        type="button"
        class="category-card"
        onclick="openAxes()"
      >
        <h2>Axes</h2>
        <p>Browse axes and their details.</p>
      </button>
    </section>

    <!-- AXES -->
    <section id="axes-page" class="page">
      <h1>Axes</h1>
      <p class="muted">Select an axe to view its details.</p>

      <div id="axe-list" class="axe-list">
        <button
          type="button"
          class="axe-card"
          onclick="openItem('rusty')"
        >
          <h2>Rusty Axe</h2>
          <p class="tier">Tier 1</p>
        </button>

        <button
          type="button"
          class="axe-card"
          onclick="openItem('steel')"
        >
          <h2>Steel Axe</h2>
          <p class="tier">Tier 2</p>
        </button>
      </div>
    </section>

    <!-- ITEM DETAILS -->
    <section id="item-page" class="page">
      <h1 id="item-title">Rusty Axe</h1>
      <p class="tier" id="item-tier">Tier 1</p>

      <div class="divider"></div>

      <div class="item-details">

        <section class="detail-section">
          <h2>Tool Statistics</h2>
          <div class="stats-box">
            <div id="item-stats" class="stats-list"></div>
          </div>
        </section>

        <section class="detail-section">
          <h2>Item Description</h2>
          <div id="item-description" class="description-box"></div>
        </section>

      </div>
    </section>

  </main>
</div>

<script>
"use strict";

const items = {
  rusty: {
    name: "Rusty Axe",
    tier: 1,
    stats: [
      ["Swing Time", "0.85s"],
      ["Swing Power", "0.65"],
      ["Swing Distance", "12 studs"],
      ["Store", "Oak Depot"],
      ["Price", "134 Oakbucks"],
      ["Obtainability", "Obtainable"]
    ],
    description: [
      "The Rusty Axe is a basic starter tool for chopping trees and processing logs. It helps players get started with woodcutting before upgrading to stronger axes."
    ]
  },

  steel: {
    name: "Steel Axe",
    tier: 2,
    stats: [
      ["Swing Time", "1.5s"],
      ["Swing Power", "0.7"],
      ["Swing Distance", "15 studs"],
      ["Store", "Oak Depot"],
      ["Price", "1,800 Oakbucks"],
      ["Obtainability", "Obtainable"]
    ],
    description: [
      "Forged with 100% steel, this will do some serious damage (but faster).",
      "It's an upgrade from the Rusty Axe by a little and is tier 2 so everybody can do that tier's ores! Happy grinding."
    ]
  }
};

let currentPage = "home";
let currentItem = null;

const pages = {
  home: document.getElementById("home-page"),
  tools: document.getElementById("tools-page"),
  axes: document.getElementById("axes-page"),
  item: document.getElementById("item-page")
};

const toolsNav = document.getElementById("tools-nav");
const axesNavContainer = document.getElementById("axes-nav-container");
const axesNav = document.getElementById("axes-nav");
const selectedAxeContainer = document.getElementById("selected-axe-container");
const selectedAxeNav = document.getElementById("selected-axe-nav");

function showPage(pageName) {
  if (!Object.prototype.hasOwnProperty.call(pages, pageName)) {
    return;
  }

  currentPage = pageName;

  Object.entries(pages).forEach(([name, element]) => {
    element.classList.toggle("active", name === pageName);
  });

  updateNavigation();
}

function updateNavigation() {
  toolsNav.classList.toggle("active", currentPage === "tools");

  /*
   * Home: only Tools is visible.
   * Tools: only Tools is visible in the sidebar.
   * Axes: Tools and Axes are visible.
   * Item: Tools, Axes and the selected item are visible.
   *
   * The unselected axe is never displayed in the item sidebar.
   */
  const showAxes = currentPage === "axes" || currentPage === "item";

  axesNavContainer.hidden = !showAxes;
  axesNav.classList.toggle("active", currentPage === "axes");

  const showSelectedItem = currentPage === "item" && currentItem !== null;
  selectedAxeContainer.hidden = !showSelectedItem;

  if (showSelectedItem) {
    selectedAxeNav.textContent = items[currentItem].name;
    selectedAxeNav.classList.add("active");
  } else {
    selectedAxeNav.classList.remove("active");
  }
}

function openHome() {
  currentItem = null;
  showPage("home");
}

function openTools() {
  currentItem = null;
  showPage("tools");
}

function openAxes() {
  currentItem = null;
  showPage("axes");
}

function openItem(itemId) {
  if (!Object.prototype.hasOwnProperty.call(items, itemId)) {
    return;
  }

  currentItem = itemId;

  const item = items[itemId];

  document.getElementById("item-title").textContent = item.name;
  document.getElementById("item-tier").textContent = "Tier " + item.tier;

  renderStats(item);
  renderDescription(item);

  showPage("item");
}

function openSelectedAxe() {
  if (currentItem !== null) {
    openItem(currentItem);
  }
}

function renderStats(item) {
  const container = document.getElementById("item-stats");
  container.replaceChildren();

  item.stats.forEach(([label, value], index) => {
    if (index === 3) {
      const divider = document.createElement("div");
      divider.className = "stat-divider";
      container.appendChild(divider);
    }

    const row = document.createElement("div");
    row.className = "stat-row";

    const statLabel = document.createElement("span");
    statLabel.className = "stat-label";
    statLabel.textContent = label;

    const statValue = document.createElement("span");
    statValue.className = "stat-value";
    statValue.textContent = value;

    row.append(statLabel, statValue);
    container.appendChild(row);
  });
}

function renderDescription(item) {
  const container = document.getElementById("item-description");
  container.replaceChildren();

  if (item.description.length === 0) {
    const paragraph = document.createElement("p");
    paragraph.textContent = "Not provided";
    container.appendChild(paragraph);
    return;
  }

  item.description.forEach(text => {
    const paragraph = document.createElement("p");
    paragraph.textContent = text;
    container.appendChild(paragraph);
  });
}

/* Start on the home screen, without home-screen buttons. */
showPage("home");
</script>
</body>
</html>
